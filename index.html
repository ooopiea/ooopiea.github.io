<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c2417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>力量年鉴 · 我的健身计划</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">STRENGTH<small>个人健身年鉴 · 三练循环</small></div>
    <div class="datechip" id="dateChip">—</div>
  </header>

  <!-- 今日 -->
  <section class="view active" id="view-today">
    <div class="day-head" id="dayHead"></div>
    <div class="day-switch" id="daySwitch"></div>
    <div class="progress-row" id="progress"></div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- 历史 -->
  <section class="view" id="view-history"><div id="history"></div></section>

  <!-- 我的 -->
  <section class="view" id="view-profile"><div id="profile"></div></section>

</div>

<nav class="nav">
  <button class="on" data-view="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M4 9.5v5M20 9.5v5M9 4v16M15 4v16"/></svg>
    <span class="navlbl">今日</span></button>
  <button data-view="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    <span class="navlbl">历史</span></button>
  <button data-view="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span class="navlbl">我的</span></button>
</nav>

<div class="toast" id="toast"></div>

<script src="js/plan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
